name: Verify data

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/verify-data.py"
      - ".github/workflows/verify-data.yml"
  push:
    paths:
      - "data/**"
      - "scripts/verify-data.py"
      - ".github/workflows/verify-data.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify every data year
        run: python3 scripts/verify-data.py
